<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>callback Example</title>
</head>
<body>
    <p id="message"></p>

    <script>
        /*A callback is a function that is passed as an argument to another 
        function and is executed after some operation has been completed.
        Callbacks are commonly used in asynchronous programming to handle
        tasks that take time to complete, such as fetching data from an API or
        performing animations.*/
        //callbacks a function passed as an argument to another function and is executed after some operation has been completed. 
        //promises a promise is an object that represents the eventual completion (or failure) of an asynchronous operation and its resulting value.
        //async/await is a syntax for working with promises that allows you to write asynchronous code
        //in a more synchronous-looking manner. It is built on top of promises and provides a cleaner and more readable way to handle asynchronous operations.
        function fetchData(callback) {
            setTimeout(function() {
                let data = "Data fetched from server";
                callback(data);
            }, 2000); // Simulating a delay of 2 seconds
        }
        function displayData(data) {
            document.getElementById("message").textContent = data;
        }
        // Call fetchData and pass displayData as the callback function
        fetchData(displayData);

        //using callbacks:
        /* 
        explation
        fetchdata is a function that simulates fetching data from a server. It takes a callback function as an argument, which will be called once the data is "fetched". In this example, we use setTimeout to simulate a delay of 2 seconds before calling the callback with the fetched data.
        it simulates an asynchronous operation, and once the data is ready, it calls the callback function (displayData) to update the content of the message element with the fetched data.
        displayData is the callback function that will be executed once the data is fetched. It takes the fetched data as an argument and updates the text content of the message element with that data.
        
        */
       //==> using promises:
       function  fetchData() {
        return new Promise(function(resolve, reject) {
            setTimeout(function() {
                let data = "Data fetched from server";
                resolve(data);
            }, 2000); // Simulating a delay of 2 seconds
        });
       }
       fetchData().then(function(data) {
        document.getElementById("message").textContent = data;
       }).catch(function(error) {
        console.error("Error fetching data:", error);
       });
       /*
       explanation:
fetchData is a function that returns a new Promise. Inside the Promise, we simulate an asynchronous operation using setTimeout. After a delay of 2 seconds, we resolve the Promise with the fetched
data. If there were an error during the fetching process, we could reject the Promise with an error message.
We call fetchData and use the .then() method to handle the resolved value (the fetched data). Inside the .then() callback, we update the text content of the message element with the fetched data. We also use .catch() to handle any potential errors that may occur during the fetching process.

       */
      //using async/await:
      async function fetchData() {
        try{
            const response = await fetch("https://jsonplaceholder.typicode.com/posts/1");
            const data = await response.json();
            document.getElementById("message").textContent = data.title;
        } catch (error) {
            console.error("Error fetching data:", error);
        }
      }
      fetchData();

      /*
      explanation:
In this example, we define an asynchronous function fetchData using the async keyword. Inside the function, we use the await keyword to wait for the fetch operation to complete before proceeding. We fetch data
from a placeholder API and then parse the response as JSON. Once we have the data, we update the text content of the message element with the title of the fetched post. We also use a try-catch block to handle any potential errors that may occur during the fetching process.
error handling is important when working with asynchronous operations, as it allows us to gracefully handle any issues that may arise, such as network errors or invalid responses. By using try-catch blocks, we can catch and log any errors that occur during the fetch operation, ensuring that our application remains robust and user-friendly.

      */
    </script>
</body>
</html>
