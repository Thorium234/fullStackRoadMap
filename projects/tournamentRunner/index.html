<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournament Runner</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>🏆 Tournament Runner</h1>
  </header>

  <main>
    <section id="setup-section">
      <div class="input-group">
        <input type="text" id="participant-input" placeholder="Enter participant name" />
        <button id="add-btn">Add</button>
      </div>
      <ul id="participant-list"></ul>
      <button id="start-btn" class="primary">Start Tournament</button>
    </section>

    <section id="bracket-section" style="display: none;">
      <div id="bracket-container"></div>
      <button id="reset-btn">New Tournament</button>
    </section>
  </main>

  <script type="module">
    import { initRender } from './js/render.js';
    import { initState } from './js/state.js';

    initState();
    initRender();
  </script>
</body>
</html>
