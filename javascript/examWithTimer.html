<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f0f2f5;
    }
    .quiz-container {
      background: white;
      width: 500px;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .question {
      font-size: 18px;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .options {
      margin-bottom: 20px;
    }
    .option {
      display: block;
      margin: 10px 0;
      padding: 10px;
      background: #f0f0f0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    .option:hover {
      background: #e0e0e0;
    }
    .timer {
      text-align: right;
      margin-bottom: 10px;
      color: #d32f2f;
      font-weight: bold;
    }
    .btn {
      padding: 10px 15px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body oncontextmenu="return false">
  <div class="quiz-container">
    <div class="timer">Time Left: <span id="time">30</span>s</div>
    <div class="question" id="question">Loading...</div>
    <div class="options" id="options"></div>
    <button class="btn" id="next" onclick="nextQuestion()">Next</button>
  </div>

  <script>
    const quiz = [
      { q: "What is 2 + 2?", o: ["3", "4", "5"], a: 1 },
      { q: "Which planet is known as the Red Planet?", o: ["Venus", "Mars", "Jupiter"], a: 1 },
      { q: "What is the capital of France?", o: ["London", "Berlin", "Paris"], a: 2 }
    ];

    let current = 0;
    let score = 0;
    let timeLeft = 30;
    const timer = setInterval(() => {
      timeLeft--;
      document.getElementById("time").textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        alert("Time's up!");
        showResult();
      }
    }, 1000);

    function loadQuestion() {
      const q = quiz[current];
      document.getElementById("question").textContent = q.q;
      const options = document.getElementById("options");
      options.innerHTML = "";
      q.o.forEach((option, i) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = option;
        btn.onclick = () => selectAnswer(i);
        options.appendChild(btn);
      });
    }

    function selectAnswer(index) {
      if (quiz[current].a === index) score++;
      document.getElementById("next").disabled = false;
    }

    function nextQuestion() {
      current++;
      if (current >= quiz.length) {
        clearInterval(timer);
        showResult();
      } else {
        document.getElementById("next").disabled = true;
        loadQuestion();
      }
    }

    function showResult() {
      document.body.innerHTML = `<div class="quiz-container"><h2>Quiz Complete!</h2><p>Your Score: ${score}/${quiz.length}</p></div>`;
    }

    // Start quiz
    loadQuestion();
    document.getElementById("next").disabled = true;
  </script>
</body>
</html>
