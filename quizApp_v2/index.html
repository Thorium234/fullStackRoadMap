<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp</title>
    <link rel="stylesheet" href="styles.css" >
</head>
<body>
    <div class="quiz">
        <!-- Question 1 -->
         <p>1. What is the capital of France?</p>
        <label><input type="radio" name="q1" value="a"> Paris</label>
        <label><input type="radio" name="q1" value="b"> London</label>
        <label><input type="radio" name="q1" value="c"> Berlin</label>

        <!-- Question 2 -->
        <p>2. What is the largest planet in our solar system?</p>
        <label><input type="radio" name="q2" value="a"> Earth</label>
        <label><input type="radio" name="q2" value="b"> Jupiter</label>
        <label><input type="radio" name="q2" value="c"> Saturn</label>

        <!-- Question 3 -->
        <p>3. What is the chemical symbol for gold?</p>
        <label><input type="radio" name="q3" value="a"> Ag</label>
        <label><input type="radio" name="q3" value="b"> Au</label>
        <label><input type="radio" name="q3" value="c"> Fe</label>

        <!-- Question 4 -->
        <p>4. What is the capital of Japan?</p>
        <label><input type="radio" name="q4" value="a"> Seoul</label>
        <label><input type="radio" name="q4" value="b"> Beijing</label>
        <label><input type="radio" name="q4" value="c"> Tokyo</label>

        <!-- Question 5 -->
        <p>5. What is the largest mammal in the world?</p>
        <label><input type="radio" name="q5" value="a"> Elephant</label>
        <label><input type="radio" name="q5" value="b"> Blue Whale</label>
        <label><input type="radio" name="q5" value="c"> Giraffe</label>

        <button onclick="submitQuiz()">Submit</button>
    </div>
    <!-- frontend results -->
     <h2 class="quizResult"></h2>

     <script src="script.js"></script>
</body>
</html>
